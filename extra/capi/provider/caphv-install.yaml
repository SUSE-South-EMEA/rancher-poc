# CAPHV (Cluster API Provider Harvester) installation manifests
# Image built from https://github.com/rancher-sandbox/cluster-api-provider-harvester
# and pushed to Gitea registry at gitea.home.zypp.fr
---
apiVersion: v1
kind: Namespace
metadata:
  name: caphv-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caphv-controller-manager
  namespace: caphv-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caphv-manager-role
  labels:
    cluster.x-k8s.io/provider: infrastructure-harvester
    cluster.x-k8s.io/v1alpha2: v1alpha1
    cluster.x-k8s.io/v1alpha3: v1alpha1
    cluster.x-k8s.io/v1beta1: v1alpha1
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, update, watch]
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusters, clusters/status, machinepools, machinepools/status, machines, machines/status, machinesets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [clusters, machines]
    verbs: [get, list, watch]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [harvesterclusters, harvestermachines]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [harvesterclusters/finalizers, harvestermachines/finalizers]
    verbs: [update]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [harvesterclusters/status, harvestermachines/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: caphv-manager-rolebinding
  labels:
    cluster.x-k8s.io/provider: infrastructure-harvester
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: caphv-manager-role
subjects:
  - kind: ServiceAccount
    name: caphv-controller-manager
    namespace: caphv-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caphv-metrics-reader
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caphv-proxy-role
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: caphv-proxy-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: caphv-proxy-role
subjects:
  - kind: ServiceAccount
    name: caphv-controller-manager
    namespace: caphv-system
---
apiVersion: v1
kind: Service
metadata:
  name: caphv-controller-manager-metrics-service
  namespace: caphv-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-harvester
    control-plane: controller-manager
spec:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: https
  selector:
    cluster.x-k8s.io/provider: infrastructure-harvester
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caphv-controller-manager
  namespace: caphv-system
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: cluster-api-provider-harvester
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: cluster-api-provider-harvester
    cluster.x-k8s.io/provider: infrastructure-harvester
    cluster.x-k8s.io/v1alpha2: v1alpha1
    cluster.x-k8s.io/v1alpha3: v1alpha1
    cluster.x-k8s.io/v1beta1: v1alpha1
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: infrastructure-harvester
      cluster.x-k8s.io/v1alpha2: v1alpha1
      cluster.x-k8s.io/v1alpha3: v1alpha1
      cluster.x-k8s.io/v1beta1: v1alpha1
      control-plane: controller-manager
  template:
    metadata:
      labels:
        cluster.x-k8s.io/provider: infrastructure-harvester
        cluster.x-k8s.io/v1alpha2: v1alpha1
        cluster.x-k8s.io/v1alpha3: v1alpha1
        cluster.x-k8s.io/v1beta1: v1alpha1
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: caphv-controller-manager
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: gitea-registry
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64, arm64, ppc64le, s390x]
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
      containers:
        - name: manager
          image: ${CAPHV_IMAGE}
          command: [/manager]
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=127.0.0.1:8080
            - --leader-elect
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            privileged: true
