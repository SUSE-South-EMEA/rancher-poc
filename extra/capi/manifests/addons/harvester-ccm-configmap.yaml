# ConfigMap containing Harvester Cloud Controller Manager manifests.
# Also contains the cloud-config Secret used by both CCM and CSI.
# The ${CLOUD_CONFIG_B64} placeholder is replaced by the deploy script
# with the base64-encoded Harvester cloud-provider kubeconfig.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harvester-ccm-addon
  namespace: ${CAPI_NAMESPACE}
data:
  harvester-cloud-provider-deploy.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: cloud-config
      namespace: kube-system
    type: Opaque
    data:
      cloud-config: ${CLOUD_CONFIG_B64}
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: harvester-cloud-controller-manager
      namespace: kube-system
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: harvester-cloud-controller-manager
    rules:
      - apiGroups: [""]
        resources: [services, nodes, events]
        verbs: [get, list, watch, create, update, patch]
      - apiGroups: [""]
        resources: [services/status]
        verbs: [update, patch]
      - apiGroups: [""]
        resources: [nodes/status]
        verbs: [patch, update]
      - apiGroups: [coordination.k8s.io]
        resources: [leases]
        verbs: [get, create, update]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: harvester-cloud-controller-manager
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: harvester-cloud-controller-manager
    subjects:
      - kind: ServiceAccount
        name: harvester-cloud-controller-manager
        namespace: kube-system
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: harvester-cloud-provider
      namespace: kube-system
      labels:
        app.kubernetes.io/component: cloud-provider
        app.kubernetes.io/name: harvester-cloud-provider
    spec:
      replicas: 2
      selector:
        matchLabels:
          app.kubernetes.io/component: cloud-provider
          app.kubernetes.io/name: harvester-cloud-provider
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cloud-provider
            app.kubernetes.io/name: harvester-cloud-provider
        spec:
          serviceAccountName: harvester-cloud-controller-manager
          containers:
            - name: harvester-cloud-provider
              image: rancher/harvester-cloud-provider:v0.2.5
              imagePullPolicy: Always
              command:
                - harvester-cloud-provider
              args:
                - --cloud-config=/etc/kubernetes/cloud-config
              volumeMounts:
                - name: cloud-config
                  mountPath: /etc/kubernetes
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node.cloudprovider.kubernetes.io/uninitialized
              operator: Equal
              value: "true"
              effect: NoSchedule
          volumes:
            - name: cloud-config
              secret:
                secretName: cloud-config
